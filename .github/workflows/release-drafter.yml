# =============================================================================
# 发布说明草稿
#
# 每次合入 `main` 都**增量维护**一份发布说明草稿（Releases → Draft）。
# 分类规则、版本号推导、正文模板都在 `.github/release-drafter.yml` 里。
#
# 为什么是"每次合入都重算"而不是"发版时再写"：
#   发版那一刻最不该做的事就是回忆两周里合了什么。草稿一直在那里，
#   发版只剩"核对 + 点 Publish"。
#
# 版本号从标签推导（release-drafter.yml 的 `version-resolver`），
# 而标签由 `pr-labeler.yml` 从 PR 标题前缀翻译 —— 三者是一条链，
# 改任何一环都要回来看另外两个。
#
# 触发方式：
#   · push 到 main → 自动重算（主要路径）
#   · 手动 workflow_dispatch → 补打标签后刷新草稿用
#     （见 docs/RELEASING.md 第 2 节：分错了通常是标签漏打，
#      补上标签后手动跑一次即可，**不需要**为了刷新说明再合一个 PR）
# =============================================================================
name: 发布说明草稿

on:
  push:
    branches: [main]
  workflow_dispatch:

# ⚠️ **`contents: write` 是必需的，不是可以收紧的项。**
#
# 这个工作流的产出就是"创建/更新一份 draft release"—— 那是 `contents` 作用域下的
# 写操作。原来写的是 `contents: read`，于是每一次运行都以
# `##[error]Resource not accessible by integration` 结束：
#
#     重算草稿  laolaoshiren/auto-quant: No draft release found
#     重算草稿  ##[error]Resource not accessible by integration
#
# 而 GitHub 把这类失败**显示成 job 成功**（步骤本身没抛），所以它静默了很久 ——
# 草稿停在 2026-09-30，而 `docs/RELEASING.md` 第 2 节要求发版前"核对草稿"。
# 也就是说：**发版流程的第 1 步在这段时间里根本无法完成，而没人看得出来。**
#
# 对比同仓库另外两个需要写权限的工作流，它们的声明都是对的：
#   · `docker-publish.yml`  → `packages: write`（推镜像）
#   · `pr-labeler.yml`      → `pull-requests: write`（打标签）
# 只有这一个漏了。`pull-requests: read` 保留 —— 分类要读 PR 的标签。
permissions:
  contents: write
  pull-requests: read

jobs:
  draft:
    name: 重算草稿
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 生成/更新草稿
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
